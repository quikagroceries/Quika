services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quika
      POSTGRES_PASSWORD: quika
      POSTGRES_DB: quika
    ports:
      # Host 5433 — 5432 is often taken by other local Postgres containers
      - "5433:5432"
    volumes:
      - quika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quika"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    # Local dev only: auto-reload on code changes (the image's own CMD is the
    # production command, without --reload).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  quika_pgdata:
