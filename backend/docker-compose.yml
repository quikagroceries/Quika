services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quika
      POSTGRES_PASSWORD: quika
      POSTGRES_DB: quika
    ports:
      - "5432:5432"
    volumes:
      - quika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quika"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/code

volumes:
  quika_pgdata:
